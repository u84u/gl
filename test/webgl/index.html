<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gl shader renderer</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 24px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #0f1115; color: #d7dae0; }
      h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
      label { display: block; margin: 0 0 6px; color: #9aa4b2; font-size: 12px; }
      textarea { width: 100%; min-height: 180px; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #2a2f3a; background: #171a21; color: inherit; font: inherit; resize: vertical; }
      .row { display: flex; gap: 16px; align-items: flex-start; margin-top: 12px; }
      button { padding: 8px 16px; border-radius: 8px; border: 1px solid #3a4a6a; background: #1d2a40; color: inherit; font: inherit; cursor: pointer; }
      canvas { width: 128px; height: 128px; image-rendering: pixelated; border-radius: 8px; border: 1px solid #2a2f3a; background: #000; }
      pre { margin: 12px 0 0; padding: 12px; border-radius: 8px; border: 1px solid #2a2f3a; background: #171a21; white-space: pre-wrap; }
      pre[data-ok="false"] { border-color: #7a2f3a; color: #ff9aa5; }
    </style>
  </head>
  <body>
    <h1>gl shader renderer</h1>
    <label for="source">GLSL ES 3.00 fragment shader</label>
    <textarea id="source" spellcheck="false"></textarea>
    <div class="row">
      <button id="run" type="button">Render</button>
      <canvas id="canvas" width="64" height="64"></canvas>
    </div>
    <pre id="output"></pre>
    <script>
      (function () {
        var VERTEX_SHADER = [
          "#version 300 es",
          "void main() {",
          "  vec2 position = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0);",
          "  gl_Position = vec4(position, 0.0, 1.0);",
          "}",
        ].join("\n");
        var DEFAULT_FRAGMENT = [
          "#version 300 es",
          "precision mediump float;",
          "out vec4 fragColor;",
          "void main() {",
          "  fragColor = vec4(1.0, 0.5, 0.25, 1.0);",
          "}",
        ].join("\n");

        function toHex(bytes) {
          var out = "";
          for (var i = 0; i < bytes.length; i++) {
            out += bytes[i].toString(16).padStart(2, "0");
          }
          return out.toUpperCase();
        }

        function compileShader(gl, type, source, label) {
          var shader = gl.createShader(type);
          if (!shader) {
            return { ok: false, error: "Unable to create " + label + " shader" };
          }
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            var log = gl.getShaderInfoLog(shader) || label + " shader failed to compile";
            gl.deleteShader(shader);
            return { ok: false, error: log };
          }
          return { ok: true, shader: shader };
        }

        var scratchCanvas = null;

        function validateShader(sourceText, stage) {
          var gl = document.createElement("canvas").getContext("webgl2");
          if (!gl) return { ok: false, stage: "context", error: "WebGL2 is not available" };
          var shader = compileShader(gl, stage === "vertex" ? gl.VERTEX_SHADER : gl.FRAGMENT_SHADER, sourceText, stage);
          if (!shader.ok) return { ok: false, stage: stage, error: shader.error };
          gl.deleteShader(shader.shader);
          return { ok: true, stage: stage };
        }

        function validateProgram(vertexSource, fragmentSource) {
          var canvas = document.createElement("canvas");
          var gl = canvas.getContext("webgl2");
          if (!gl) {
            return { ok: false, stage: "context", error: "WebGL2 is not available" };
          }
          var vs = compileShader(gl, gl.VERTEX_SHADER, vertexSource, "vertex");
          if (!vs.ok) return { ok: false, stage: "vertex", error: vs.error };
          var fs = compileShader(gl, gl.FRAGMENT_SHADER, fragmentSource, "fragment");
          if (!fs.ok) {
            gl.deleteShader(vs.shader);
            return { ok: false, stage: "fragment", error: fs.error };
          }
          var program = gl.createProgram();
          if (!program) {
            gl.deleteShader(vs.shader);
            gl.deleteShader(fs.shader);
            return { ok: false, stage: "link", error: "Unable to create program" };
          }
          gl.attachShader(program, vs.shader);
          gl.attachShader(program, fs.shader);
          gl.linkProgram(program);
          gl.deleteShader(vs.shader);
          gl.deleteShader(fs.shader);
          var ok = gl.getProgramParameter(program, gl.LINK_STATUS);
          var error = ok ? undefined : gl.getProgramInfoLog(program) || "Program failed to link";
          gl.deleteProgram(program);
          return { ok: ok, stage: "link", error: error };
        }

        function renderShader(fragmentSource, options) {
          var opts = options || {};
          var width = Math.max(1, Math.floor(opts.width || 8));
          var height = Math.max(1, Math.floor(opts.height || 8));
          if (!opts.canvas && !scratchCanvas) {
            scratchCanvas = document.createElement("canvas");
          }
          var canvas = opts.canvas || scratchCanvas;
          canvas.width = width;
          canvas.height = height;
          var gl = canvas.getContext("webgl2", {
            antialias: false,
            alpha: true,
            premultipliedAlpha: false,
            preserveDrawingBuffer: true,
          });
          if (!gl) {
            return { ok: false, stage: "context", error: "WebGL2 is not available" };
          }

          var vs = compileShader(gl, gl.VERTEX_SHADER, VERTEX_SHADER, "vertex");
          if (!vs.ok) {
            return { ok: false, stage: "vertex", error: vs.error };
          }
          var fs = compileShader(gl, gl.FRAGMENT_SHADER, fragmentSource, "fragment");
          if (!fs.ok) {
            gl.deleteShader(vs.shader);
            return { ok: false, stage: "fragment", error: fs.error };
          }

          var program = gl.createProgram();
          if (!program) {
            gl.deleteShader(vs.shader);
            gl.deleteShader(fs.shader);
            return { ok: false, stage: "link", error: "Unable to create program" };
          }
          gl.attachShader(program, vs.shader);
          gl.attachShader(program, fs.shader);
          gl.linkProgram(program);
          gl.deleteShader(vs.shader);
          gl.deleteShader(fs.shader);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            var linkLog = gl.getProgramInfoLog(program) || "Program failed to link";
            gl.deleteProgram(program);
            return { ok: false, stage: "link", error: linkLog };
          }

          gl.useProgram(program);
          gl.viewport(0, 0, width, height);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          var drawError = gl.getError();

          var pixels = new Uint8Array(4);
          gl.readPixels(Math.floor(width / 2), Math.floor(height / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
          var readError = gl.getError();
          gl.deleteProgram(program);

          if (readError !== gl.NO_ERROR) {
            return {
              ok: false,
              stage: "readPixels",
              error: "WebGL error 0x" + readError.toString(16),
              glError: readError,
            };
          }

          return {
            ok: true,
            pixel: toHex(pixels),
            pixels: Array.from(pixels),
            width: width,
            height: height,
            glError: drawError,
          };
        }

        window.renderShader = renderShader;
        window.validateShader = validateShader;
        window.validateProgram = validateProgram;

        var source = document.getElementById("source");
        var output = document.getElementById("output");
        var canvas = document.getElementById("canvas");
        var runButton = document.getElementById("run");
        source.value = DEFAULT_FRAGMENT;

        function run() {
          var result = renderShader(source.value, { width: 64, height: 64, canvas: canvas });
          output.dataset.ok = String(result.ok);
          output.textContent = result.ok
            ? "OK  center=" + result.pixel + "  size=" + result.width + "x" + result.height
            : "ERROR (" + result.stage + ")\n" + result.error;
        }

        runButton.addEventListener("click", run);
        if (location.hash !== "#manual") {
          run();
        }
      })();
    </script>
  </body>
</html>
